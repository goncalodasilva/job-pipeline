# Hooks run before every commit (install once with `uv run pre-commit install`).
# Never bypass them with --no-verify.
# Revs are pinned to commit SHAs. To update, run `uv run pre-commit autoupdate --freeze` and
# `uv lock --upgrade-package ruff` to the same ruff version; a unit test checks they match.
# Tests build key-shaped strings at runtime, so gitleaks runs without an allowlist.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      # Scans the staged changes of each commit.
      - id: gitleaks
      # Scans committed history; the default hook above finds nothing on a clean checkout.
      # Run with `uv run pre-commit run --hook-stage manual gitleaks-history` (CI, full verify).
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in git history
        entry: gitleaks git --redact --verbose
        stages: [manual]
        always_run: true
