[project]
name = "jobpipeline"
version = "0.1.0"
description = "A local web app that helps one person run an honest, organized job search."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.142",
    "jinja2>=3.1.6",
    "platformdirs>=4.12",
    "pydantic>=2.13",
    "uvicorn>=0.54",
]

[project.scripts]
jobpipeline = "app.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4",
    "playwright>=1.63",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Agent tooling (.claude/) and the spec's abbreviated code samples (docs/) are not project code.
extend-exclude = [".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: uses real SQLite and HTTP routes, with fake providers",
    "contract: shared provider contract suites",
    "e2e: Playwright against the running app",
    "smoke: start, health check, stop",
    "live: real providers; skipped unless JOBPIPELINE_LIVE_TESTS=1",
    "slow: longer property or performance tests",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
