<form id="inbox-filters" class="inbox-filters" action="/inbox" method="get" hx-get="/inbox/queue" hx-target="#inbox" hx-swap="outerHTML settle:0ms" hx-disabled-elt="find button">
  <input type="hidden" name="view" value="{{ view }}"><input type="hidden" name="focus" value="1"><input type="hidden" name="push" value="1">
  <div class="field"><label for="inbox-search">Search jobs</label><input id="inbox-search" type="search" name="search" maxlength="500" value="{{ filters.search }}"></div>
  <div class="field"><label for="filter-band">Fit</label><select id="filter-band" name="band"><option value="">Any fit</option>{% for value in ['strong', 'possible', 'stretch'] %}<option value="{{ value }}"{% if filters.band == value %} selected{% endif %}>{{ value | capitalize }}</option>{% endfor %}</select></div>
  {% for field, label in [('work_mode', 'Work mode'), ('industry', 'Industry'), ('seniority', 'Seniority'), ('company', 'Company')] %}
  <div class="field"><label for="filter-{{ field }}">{{ label }}</label><select id="filter-{{ field }}" name="{{ field }}"><option value="">Any {{ label | lower }}</option>{% for choice in choices[field] %}<option value="{{ choice.value }}"{% if filters[field] == choice.value %} selected{% endif %}>{{ choice.label }}</option>{% endfor %}</select></div>
  {% endfor %}
  <div class="field"><label for="filter-flagged">Preferences</label><select id="filter-flagged" name="flagged"><option value="">Any</option><option value="1"{% if filters.flagged is sameas true %} selected{% endif %}>Conflicts with preferences</option><option value="0"{% if filters.flagged is sameas false %} selected{% endif %}>No flagged conflict</option></select></div>
  <div class="field"><label for="inbox-sort">Sort</label><select id="inbox-sort" name="sort">{% for key, label in [('newest', 'Newest added'), ('posting_age', 'Posting date'), ('band', 'Fit')] %}<option value="{{ key }}"{% if filters.sort == key %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="field"><label for="inbox-group">Group by</label><select id="inbox-group" name="group_by"><option value="">No grouping</option>{% for key, label in [('company', 'Company'), ('industry', 'Industry'), ('band', 'Fit'), ('work_mode', 'Work mode'), ('seniority', 'Seniority')] %}<option value="{{ key }}"{% if group_by == key %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <button type="submit" class="button button-primary">Apply filters</button><a href="/inbox?view={{ view }}" hx-get="/inbox/queue?view={{ view }}&amp;focus=1" hx-target="#inbox" hx-swap="outerHTML settle:0ms" hx-push-url="/inbox?view={{ view }}">Clear filters</a>
</form>
