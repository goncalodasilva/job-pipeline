<dialog id="application-drawer" class="job-drawer application-drawer" aria-labelledby="application-drawer-heading" aria-modal="true">
  <div class="drawer-top">
    <h2 id="application-drawer-heading">Application details</h2>
    <button type="button" class="button" data-application-close autofocus>Close</button>
  </div>
  <p><a href="/applications/{{ application.id }}">Open workspace</a></p>
  <p data-application-draft hidden>Your unsaved values have been restored.</p>
  {% include "fragments/applications/_detail.html" %}
</dialog>
